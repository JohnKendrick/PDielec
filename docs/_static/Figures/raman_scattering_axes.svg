<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">
    Raman Scattering Experiment
  </text>
  
  <!-- Incoming laser beam (along Z axis) -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#e63946"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#457b9d"/>
    </marker>
    <marker id="arrowhead-black" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
    <marker id="arrowhead-teal" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a9d8f"/>
    </marker>
    <marker id="arrowhead-orange" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f4511e"/>
    </marker>
  </defs>
  
  <!-- Incoming laser beam with glow effect -->
  <line x1="100" y1="280" x2="330" y2="280" stroke="#e63946" stroke-width="8" opacity="0.3"/>
  <line x1="100" y1="280" x2="330" y2="280" stroke="#e63946" stroke-width="4" marker-end="url(#arrowhead)"/>
  <text x="210" y="260" font-family="Arial, sans-serif" font-size="14" fill="#e63946" font-weight="bold">
    Incoming Laser
  </text>
  
  <!-- Crystal (hexagonal prism with faceted morphology) -->
  <g id="crystal">
    <!-- Front hexagonal face -->
    <path d="M 400 240 L 440 260 L 440 300 L 400 320 L 360 300 L 360 260 Z" 
          fill="#b8e6f0" stroke="#1d3557" stroke-width="2.5"/>
    
    <!-- Top facets -->
    <path d="M 400 240 L 440 260 L 430 220 L 400 210 Z" 
          fill="#d4f1f9" stroke="#1d3557" stroke-width="2"/>
    <path d="M 400 240 L 360 260 L 370 220 L 400 210 Z" 
          fill="#e8f7fb" stroke="#1d3557" stroke-width="2"/>
    <path d="M 400 210 L 430 220 L 370 220 Z" 
          fill="#f0fbfd" stroke="#1d3557" stroke-width="2"/>
    
    <!-- Side facets -->
    <path d="M 440 260 L 440 300 L 460 290 L 460 250 Z" 
          fill="#8ecae6" stroke="#1d3557" stroke-width="2"/>
    <path d="M 360 260 L 360 300 L 340 290 L 340 250 Z" 
          fill="#a8dadc" stroke="#1d3557" stroke-width="2"/>
    
    <!-- Bottom facets -->
    <path d="M 400 320 L 440 300 L 430 340 L 400 350 Z" 
          fill="#69b8d6" stroke="#1d3557" stroke-width="2"/>
    <path d="M 400 320 L 360 300 L 370 340 L 400 350 Z" 
          fill="#7cc5dc" stroke="#1d3557" stroke-width="2"/>
    
    <text x="400" y="385" font-family="Arial, sans-serif" font-size="14" fill="#1d3557" font-weight="bold" text-anchor="middle">
      Crystal
    </text>
  </g>
  
  <!-- Scattered light beam (at angle) -->
  <line x1="400" y1="280" x2="620" y2="160" stroke="#457b9d" stroke-width="6" opacity="0.3"/>
  <line x1="400" y1="280" x2="620" y2="160" stroke="#457b9d" stroke-width="3" marker-end="url(#arrowhead-blue)"/>
  <text x="540" y="200" font-family="Arial, sans-serif" font-size="14" fill="#457b9d" font-weight="bold">
    Scattered Light
  </text>
  
  <!-- Laboratory coordinate system (X, Y, Z) - origin lower left -->
  <g id="lab-coordinates" transform="translate(120, 480)">
    <!-- Z axis (pointing toward crystal, along laser) -->
    <line x1="0" y1="0" x2="100" y2="0" stroke="#2a9d8f" stroke-width="3" marker-end="url(#arrowhead-teal)"/>
    <text x="110" y="8" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2a9d8f">Z</text>
    
    <!-- X axis -->
    <line x1="0" y1="0" x2="0" y2="-80" stroke="#2a9d8f" stroke-width="3" marker-end="url(#arrowhead-teal)"/>
    <text x="8" y="-85" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2a9d8f">X</text>
    
    <!-- Y axis (into page, shown as perspective) -->
    <line x1="0" y1="0" x2="-50" y2="-30" stroke="#2a9d8f" stroke-width="3" marker-end="url(#arrowhead-teal)"/>
    <text x="-65" y="-25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2a9d8f">Y</text>
    
    <text x="-20" y="25" font-family="Arial, sans-serif" font-size="12" fill="#333" font-style="italic">
      Lab Frame (X,Y,Z)
    </text>
  </g>
  
  <!-- Crystal coordinate system (x, y, z) - rotated relative to lab frame -->
  <g id="crystal-coordinates" transform="translate(400, 280)">
    <!-- z axis (rotated from Z) -->
    <line x1="0" y1="0" x2="70" y2="-60" stroke="#f4511e" stroke-width="2.5" marker-end="url(#arrowhead-orange)"/>
    <text x="80" y="-60" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f4511e">z</text>
    
    <!-- x axis (rotated from X) -->
    <line x1="0" y1="0" x2="-50" y2="-75" stroke="#f4511e" stroke-width="2.5" marker-end="url(#arrowhead-orange)"/>
    <text x="-60" y="-80" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f4511e">x</text>
    
    <!-- y axis (rotated from Y) -->
    <line x1="0" y1="0" x2="80" y2="35" stroke="#f4511e" stroke-width="2.5" marker-end="url(#arrowhead-orange)"/>
    <text x="90" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f4511e">y</text>
    
    <text x="-40" y="90" font-family="Arial, sans-serif" font-size="11" fill="#333" font-style="italic">
      Crystal Frame (x,y,z)
    </text>
  </g>
  
  <!-- Annotations -->
  <text x="50" y="550" font-family="Arial, sans-serif" font-size="12" fill="#666">
    Note: Z-axis aligned with incoming laser beam; crystal frame (x,y,z) rotated relative to lab frame (X,Y,Z)
  </text>
</svg>